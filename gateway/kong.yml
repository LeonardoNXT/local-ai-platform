_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:3002
    routes:
      - name: auth-well-known-routes
        paths:
          - /.well-known
        strip_path: false

      - name: auth-oauth-routes
        paths:
          - /oauth
        strip_path: false

      - name: auth-routes
        paths:
          - /auth
        strip_path: true
  - name: user-service
    url: http://user-service:3001
    routes:
      - name: users
        paths:
          - /users
        strip_path: false
